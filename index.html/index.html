<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo de Matemática</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .caixa {
        background: rgba(255,255,255,0.15);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        width: 90%;
        max-width: 420px;
    }
    h1 { margin-bottom: 10px; }
    .pergunta {
        font-size: 32px;
        margin: 30px 0;
        font-weight: bold;
    }
    .opcoes button {
        display: block;
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        background: rgba(255,255,255,0.2);
        color: white;
        cursor: pointer;
    }
    .opcoes button:hover {
        background: rgba(255,255,255,0.35);
    }
    .certo { background: #10b981 !important; }
    .errado { background: #ef4444 !important; }
    .info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 18px;
    }
    .botao {
        background: white;
        color: #1e3a8a;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 30px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="caixa" id="tela-inicio">
    <h1>🧮 Jogo de Matemática</h1>
    <p>Responda 10 perguntas</p>
    <button class="botao" onclick="iniciar()">Começar</button>
</div>

<div class="caixa" id="tela-jogo" style="display:none;">
    <div class="info">
        <span>Pergunta: <b id="num">1</b>/10</span>
        <span>Pontos: <b id="pontos">0</b></span>
    </div>
    <div class="pergunta" id="pergunta">5 + 3 = ?</div>
    <div class="opcoes" id="opcoes"></div>
    <div id="feedback" style="margin-top:15px; font-size:18px;"></div>
</div>

<div class="caixa" id="tela-fim" style="display:none;">
    <h1>Fim de Jogo!</h1>
    <h2 id="resultado">0 pontos</h2>
    <p id="mensagem"></p>
    <button class="botao" onclick="iniciar()">Jogar de novo</button>
</div>

<script>
let pontos = 0;
let atual = 0;
let respostaCerta = 0;

function iniciar() {
    pontos = 0;
    atual = 0;
    document.getElementById('tela-inicio').style.display = 'none';
    document.getElementById('tela-fim').style.display = 'none';
    document.getElementById('tela-jogo').style.display = 'block';
    document.getElementById('pontos').innerText = 0;
    proxima();
}

function proxima() {
    if (atual >= 10) {
        fim();
        return;
    }
    atual++;
    document.getElementById('num').innerText = atual;
    document.getElementById('feedback').innerText = '';

    // Gera pergunta
    const ops = ['+', '-', '×', '÷'];
    const op = ops[Math.floor(Math.random() * 4)];
    let a, b, resp, texto;

    if (op === '+') {
        a = Math.floor(Math.random()*40)+1;
        b = Math.floor(Math.random()*40)+1;
        resp = a + b;
        texto = a + ' + ' + b + ' = ?';
    } else if (op === '-') {
        a = Math.floor(Math.random()*40)+20;
        b = Math.floor(Math.random()*a);
        resp = a - b;
        texto = a + ' - ' + b + ' = ?';
    } else if (op === '×') {
        a = Math.floor(Math.random()*10)+1;
        b = Math.floor(Math.random()*10)+1;
        resp = a * b;
        texto = a + ' × ' + b + ' = ?';
    } else {
        b = Math.floor(Math.random()*9)+2;
        resp = Math.floor(Math.random()*10)+1;
        a = b * resp;
        texto = a + ' ÷ ' + b + ' = ?';
    }

    respostaCerta = resp;
    document.getElementById('pergunta').innerText = texto;

    // Gera opções
    let opcoes = [resp];
    while (opcoes.length < 4) {
        let errada = resp + Math.floor(Math.random()*11) - 5;
        if (errada > 0 && !opcoes.includes(errada)) {
            opcoes.push(errada);
        }
    }
    opcoes = opcoes.sort(() => Math.random() - 0.5);

    const div = document.getElementById('opcoes');
    div.innerHTML = '';
    opcoes.forEach(valor => {
        const btn = document.createElement('button');
        btn.innerText = valor;
        btn.onclick = () => verificar(btn, valor);
        div.appendChild(btn);
    });
}

function verificar(botao, valor) {
    const botoes = document.querySelectorAll('.opcoes button');
    botoes.forEach(b => b.disabled = true);

    if (valor === respostaCerta) {
        botao.classList.add('certo');
        pontos++;
        document.getElementById('pontos').innerText = pontos;
        document.getElementById('feedback').innerText = '✅ Correto!';
    } else {
        botao.classList.add('errado');
        document.getElementById('feedback').innerText = '❌ Errado! Era ' + respostaCerta;
        botoes.forEach(b => {
            if (parseInt(b.innerText) === respostaCerta) {
                b.classList.add('certo');
            }
        });
    }

    setTimeout(proxima, 1200);
}

function fim() {
    document.getElementById('tela-jogo').style.display = 'none';
    document.getElementById('tela-fim').style.display = 'block';
    document.getElementById('resultado').innerText = pontos + ' pontos';

    let msg = '';
    if (pontos === 10) msg = '🏆 Perfeito!';
    else if (pontos >= 7) msg = '🎉 Muito bem!';
    else if (pontos >= 5) msg = '👍 Bom trabalho!';
    else msg = '💪 Continue praticando!';
    document.getElementById('mensagem').innerText = msg;
}
</script>

</body>
</html>
